# PR #290: the maintainer asked how the PR compares with develop with the
# readall() chunk multiplier set to 10 instead of 4. This runs the full
# benchmark matrix of eval-pr290-full for develop (cfcf8b9), an A/A copy of
# develop, the PR (b5e0495), and x10 (develop with `buffer_size * 10`,
# patches/x10.diff), plus tracemalloc peaks and readall() counters. The sweep
# job covers compression ratios from 2 to 32 to 1 around the limits of 4 and
# 10, and runs the test suites. Every job builds all variants on its own
# runner, so every comparison is paired on one machine. Not part of the PR.
name: eval-pr290-x10
on:
  push:
    branches: [eval-pr290-x10]
  workflow_dispatch:

env:
  DEVELOP_SHA: cfcf8b9157707b4c0ccd2f38ef2ebdbdc2f08322
  PR_SHA: b5e04953bd3194ef80ea637a65be5091bf102542
  ROUNDS: 11
  VARIANTS: develop pr x10 stats-dev stats-pr stats-x10

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        kind: [text, json21, json10, json5, fastq, csv, log, sweep]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings (the variant patches expect them)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: eval
      - uses: actions/checkout@v4
        with:
          repository: pycompression/python-isal
          ref: ${{ env.DEVELOP_SHA }}
          path: work/src/develop
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: ptweezy/python-isal
          ref: ${{ env.PR_SHA }}
          path: work/src/pr
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install nasm (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq nasm
      - name: Install nasm (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm
      - name: Set MSVC developer prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Record the environment
        run: |
          mkdir -p results
          {
            python -c "import platform, sys, os; print(platform.platform()); print(platform.machine(), platform.processor()); print(sys.version); print('cpus', os.cpu_count())"
            case "$RUNNER_OS" in
              Linux) lscpu | grep -E "Model name|^CPU\(s\)|Hypervisor"; uname -a; gcc --version | head -1; cat /sys/kernel/mm/transparent_hugepage/enabled; free -m ;;
              macOS) sysctl -n machdep.cpu.brand_string; sw_vers; uname -a; cc --version | head -1; sysctl -n hw.memsize ;;
              Windows) powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name; (Get-CimInstance Win32_OperatingSystem).Caption; (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory"; cl 2>&1 | head -1 ;;
            esac
            gzip --version 2>&1 | head -1
          } > results/env.txt 2>&1
          cat results/env.txt
      - name: Build the variants
        run: python eval/bench/build_variants.py work $VARIANTS 2>&1 | tee results/build.log
      - name: Generate the data
        run: |
          if [ "$RUNNER_OS" = Windows ]; then py=work/v/develop/Scripts/python.exe; else py=work/v/develop/bin/python; fi
          if [ "${{ matrix.kind }}" = sweep ]; then
            $py eval/bench/gen_sweep.py eval/data/src work/sweep | tee results/data.txt
            cp work/sweep/manifest.json results/manifest.json
          else
            $py eval/bench/gen_datasets.py eval/data/src work/data ${{ matrix.kind }} | tee results/data.txt
            cp work/data/manifest.json results/manifest.json
            ! grep -q "RAW DATA DIFFERS" results/data.txt
          fi
      - name: Benchmarks
        run: |
          if [ "${{ matrix.kind }}" = sweep ]; then
            python eval/bench/make_sweep_specs.py work/sweep work/v work/specs/full.json $ROUNDS
          else
            python eval/bench/make_full_specs.py work/data/gz work/v work/specs/full.json $ROUNDS ${{ matrix.kind }}
          fi
          python eval/bench/make_extra_specs.py work/specs/full.json work/v
          python eval/bench/bench.py work/specs/full.json results/full.jsonl
          python eval/bench/bench.py work/specs/full_tm.json results/full_tm.jsonl
          python eval/bench/bench.py work/specs/full_stats.json results/full_stats.jsonl
      - name: Tests
        if: matrix.kind == 'sweep'
        run: |
          for v in develop x10; do
            if [ "$RUNNER_OS" = Windows ]; then py=work/v/$v/Scripts/python.exe; else py=work/v/$v/bin/python; fi
            echo "== $v own suite: $( (cd work/src/$v && ../../../$py -m pytest -q -p no:cacheprovider tests/ 2>&1) | tail -1)" | tee -a results/tests.txt
          done
          for v in develop pr x10; do
            if [ "$RUNNER_OS" = Windows ]; then py=work/v/$v/Scripts/python.exe; else py=work/v/$v/bin/python; fi
            $py -m pytest -q -p no:cacheprovider -rf work/src/pr/tests/test_readall.py > results/test_readall.$v.txt 2>&1 || true
            echo "== $v PR test_readall.py: $(tail -1 results/test_readall.$v.txt)" | tee -a results/tests.txt
            grep "^FAILED" results/test_readall.$v.txt | tee -a results/tests.txt || true
          done
      - name: Summaries
        if: always()
        run: |
          [ -f results/full.jsonl ] || exit 0
          python eval/bench/full_summary.py --clock cpu --json results/full.cpu.json --title "${{ matrix.os }} ${{ matrix.kind }}, CPU time" results/full.jsonl > results/full.cpu.md
          python eval/bench/full_summary.py --clock wall --json results/full.wall.json --title "${{ matrix.os }} ${{ matrix.kind }}, wall time" results/full.jsonl > results/full.wall.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x10-${{ matrix.os }}-${{ matrix.kind }}
          path: results/
